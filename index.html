<style>
:root{
  --ink:#0E1B2C;--ink-2:#15283F;--ink-3:#1E3550;
  --gold:#B8975A;--gold-2:#D9C29A;--gold-3:#F1E7D3;
  --ivory:#F6F3EC;--paper:#FFFDF8;--line:#E7DFCF;--line-2:#EFE9DD;
  --text:#1B2433;--muted:#6E7480;--soft:#9A9688;
  --serif:"Frank Ruhl Libre",Georgia,serif;--sans:Heebo,Arial,sans-serif;
  --r:14px;--shadow:0 1px 2px rgba(14,27,44,.04),0 8px 24px rgba(14,27,44,.06);
  --shadow-lg:0 2px 6px rgba(14,27,44,.06),0 24px 60px rgba(14,27,44,.16);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--ivory);color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
::selection{background:var(--gold-3)}
.app{display:grid;grid-template-columns:272px minmax(0,1fr);min-height:100vh}

.side{background:var(--ink);color:#E9E4D8;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:28px 20px 22px;border-left:1px solid #0A1522}
.brand{display:flex;align-items:center;gap:12px;padding:0 6px 24px;border-bottom:1px solid rgba(217,194,154,.18)}
.mark{width:46px;height:46px;border-radius:10px;border:1px solid var(--gold);display:grid;place-items:center;color:var(--gold-2);font-family:var(--serif);font-size:21px;font-weight:700;background:linear-gradient(160deg,#1B3250,#0E1B2C)}
.brand b{display:block;font-family:var(--serif);font-weight:700;font-size:21px;color:#FFF;letter-spacing:.2px}
.brand small{display:block;direction:ltr;text-align:right;font-size:12px;letter-spacing:2.2px;color:var(--gold-2);opacity:.85;margin-top:2px}
.navlabel{font-size:12px;letter-spacing:1.5px;color:#8D97A6;margin:26px 10px 10px}
.nav{display:grid;gap:4px}
.nav button{display:flex;align-items:center;gap:12px;border:0;background:transparent;color:#C9CED6;padding:11px 12px;border-radius:10px;text-align:right;font-size:15px;position:relative;transition:.15s}
.nav button svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.6;flex:0 0 auto;opacity:.85}
.nav button:hover{background:rgba(255,255,255,.04);color:#fff}
.nav button.on{background:linear-gradient(90deg,rgba(184,151,90,.06),rgba(184,151,90,.16));color:#fff}
.nav button.on::after{content:"";position:absolute;right:-20px;top:9px;bottom:9px;width:3px;border-radius:3px 0 0 3px;background:var(--gold)}
.nav button.on svg{color:var(--gold-2);opacity:1}
.nav .count{margin-inline-start:auto;font-size:12px;color:#8D97A6;font-variant-numeric:tabular-nums}
.addbtn{margin-top:22px;display:flex;align-items:center;justify-content:center;gap:8px;border:1px solid rgba(217,194,154,.45);background:transparent;color:var(--gold-2);border-radius:10px;padding:11px;font-weight:500;transition:.15s}
.addbtn:hover{background:rgba(217,194,154,.08);border-color:var(--gold-2)}
.sidefoot{margin-top:auto;padding:16px 8px 0;border-top:1px solid rgba(217,194,154,.14);font-size:12px;color:#8D97A6;display:flex;align-items:center;gap:8px}
.dot{width:7px;height:7px;border-radius:50%;background:#4FB39A;box-shadow:0 0 0 3px rgba(79,179,154,.15)}

.main{padding:40px 48px 64px;max-width:1360px;width:100%;margin:0 auto}
.eyebrow{display:flex;align-items:center;justify-content:center;gap:12px;font-size:13.5px;letter-spacing:.4px;color:#7A5E2C;direction:rtl;font-weight:500}
.eyebrow::before,.eyebrow::after{content:"";width:44px;height:1px;background:var(--gold);opacity:.6}
.pagehead{text-align:center;margin:10px 0 30px}
.pagehead h1{font-family:var(--serif);font-weight:900;font-size:38px;line-height:1.1;margin:10px 0 8px;color:var(--ink);letter-spacing:-.3px}
.pagehead p{margin:0;color:var(--muted);font-size:17px}
.pagehead.left{text-align:right;margin-bottom:22px}
.pagehead.left .eyebrow{justify-content:flex-start}
.pagehead.left .eyebrow::before{display:none}
.pagehead.left .eyebrow::after{display:block;width:36px}
.pagehead.left h1{font-size:38px}

.motto{display:flex;align-items:center;justify-content:center;gap:10px;margin:0 auto 22px;padding:8px 20px;width:fit-content;max-width:100%;border-radius:24px;background:linear-gradient(90deg,#F4EAD3,#FBF6EA 50%,#F4EAD3);border:1px solid #E5D3AC;color:#5E4719;font-family:var(--serif);font-size:17px;font-weight:500;box-shadow:0 1px 0 #fff inset}
.motto svg{width:16px;height:16px;fill:none;stroke:#B8975A;stroke-width:1.6;flex:0 0 auto}
.hero{position:relative;overflow:hidden;border-radius:24px;padding:38px 46px 30px;background:radial-gradient(80% 120% at 100% 0%,#FBF1DD 0%,rgba(251,241,221,0) 60%),radial-gradient(60% 90% at 0% 100%,#EEF0EA 0%,rgba(238,240,234,0) 65%),var(--paper);border:1px solid var(--line);box-shadow:var(--shadow)}
.hero::before{content:"";position:absolute;inset:9px;border:1px solid rgba(184,151,90,.3);border-radius:16px;pointer-events:none}
.hero::after{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(14,27,44,.08) 1px,transparent 1.3px);background-size:18px 18px;-webkit-mask-image:linear-gradient(90deg,#000,transparent 48%);mask-image:linear-gradient(90deg,#000,transparent 48%);pointer-events:none}
.hero .net{position:absolute;left:26px;top:50%;transform:translateY(-50%);width:300px;height:220px;pointer-events:none}
.hero .net .pulse{animation:pl 3.2s ease-in-out infinite;transform-origin:150px 120px}
@keyframes pl{0%,100%{opacity:.25;transform:scale(1)}50%{opacity:.6;transform:scale(1.35)}}
.hero .inner{position:relative;z-index:1;max-width:calc(100% - 330px)}
.hero .kicker{display:inline-flex;align-items:center;gap:8px;color:#7C6232;font-size:12px;background:#F5ECD8;border:1px solid #E6D5B0;padding:4px 12px;border-radius:24px}
.hero .kicker svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.8}
.hero h2{font-family:var(--serif);font-weight:900;font-size:38px;color:var(--ink);margin:14px 0 6px;line-height:1.15}
.hero h2 em{font-style:normal;color:#7C6232;background:linear-gradient(transparent 64%,#F0DFBA 64%);padding:0 2px}
.hero p{margin:0 0 20px;color:var(--muted);font-size:15px}
.searchrow{position:relative;z-index:1;display:flex;gap:10px}
.searchbox{flex:1;display:flex;align-items:center;gap:10px;background:#fff;border-radius:16px;padding:0 16px;border:1.5px solid #D8C9A8;box-shadow:0 2px 0 rgba(184,151,90,.12)}
.searchbox:focus-within{border-color:var(--ink);box-shadow:0 0 0 4px rgba(184,151,90,.18)}
.searchbox svg{width:20px;height:20px;stroke:#A08453;fill:none;stroke-width:1.8;flex:0 0 auto}
.searchbox input{flex:1;border:0;outline:0;background:transparent;padding:14px 0;font-size:17px;color:var(--text)}
.kbd{font-size:12px;color:var(--soft);border:1px solid var(--line);border-radius:6px;padding:1px 7px;direction:ltr}
.btn-ink{border:0;border-radius:16px;padding:0 26px;background:var(--ink);color:var(--gold-2);font-weight:600;letter-spacing:.3px;transition:.15s}
.btn-ink:hover{background:var(--ink-3)}
.quick{position:relative;z-index:1;display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.quick button{display:inline-flex;align-items:center;gap:6px;border:1px solid;border-radius:24px;padding:5px 13px;font-size:13.5px;background:#fff;transition:.15s}
.quick button svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.quick button:hover{transform:translateY(-1px);box-shadow:var(--shadow)}
body:not(.admin) .adm{display:none!important}
.sform{max-width:860px}
.step{display:grid;grid-template-columns:52px minmax(0,1fr);gap:18px;background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:22px 24px;margin-bottom:14px;box-shadow:var(--shadow);position:relative}
.step .num{width:46px;height:46px;border-radius:50%;border:1px solid var(--gold);display:grid;place-items:center;font-family:var(--serif);font-size:21px;color:#7C6232;background:#FBF6EA}
.step h4{margin:6px 0 4px;font-family:var(--serif);font-size:21px;color:var(--ink)}
.step .sub{margin:0 0 14px;color:var(--muted);font-size:13.5px}
.sgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.sactions{display:flex;align-items:center;gap:14px;margin:6px 0 30px}
.sactions .btn-ink{padding:14px 30px;font-size:15px}
.sactions span{color:var(--soft);font-size:13.5px}
.done{text-align:center;background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:46px 24px;box-shadow:var(--shadow);max-width:620px}
.done .ok{width:64px;height:64px;border-radius:50%;margin:0 auto 14px;background:#EEF3EA;display:grid;place-items:center}
.done .ok svg{width:30px;height:30px;fill:none;stroke:#3F6B5C;stroke-width:2}
.done h3{font-family:var(--serif);font-size:28px;margin:0 0 6px;color:var(--ink)}
.done p{color:var(--muted);margin:0 0 20px}
.sug{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:18px 20px;box-shadow:var(--shadow);margin-bottom:12px}
.sug h4{margin:0;font-family:var(--serif);font-size:21px;color:var(--ink)}
.sug .meta2{color:var(--muted);font-size:13.5px;margin:2px 0 10px}
.sug .kv2{display:grid;grid-template-columns:120px 1fr;gap:6px 12px;font-size:13.5px}
.sug .kv2 span{color:var(--muted)}
.sug .acts{display:flex;gap:8px;margin-top:14px}.quick button:hover{border-color:var(--gold-2);color:#fff;background:rgba(217,194,154,.1)}

.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin:24px 0 8px}
.stat{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;display:flex;align-items:center;gap:16px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.stat::before{content:"";position:absolute;top:0;right:0;left:0;height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent);opacity:.7}
.stat .ic{width:46px;height:46px;border-radius:10px;background:var(--gold-3);display:grid;place-items:center;flex:0 0 auto}
.stat .ic svg{width:22px;height:22px;stroke:#8A6D38;fill:none;stroke-width:1.6}
.stat span{display:block;color:var(--muted);font-size:13.5px}
.stat b{display:block;font-family:var(--serif);font-size:28px;line-height:1.1;color:var(--ink);font-weight:700;font-variant-numeric:lining-nums}

.section{margin-top:34px}
.sechead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:16px}
.sechead h3{margin:0;font-family:var(--serif);font-size:28px;font-weight:700;color:var(--ink);display:flex;align-items:center;gap:14px}
.sechead h3::after{content:"";width:56px;height:1px;background:var(--gold)}
.sechead .sub{color:var(--muted);font-size:13.5px}
.link{border:0;background:none;color:#7C6232;font-weight:600;font-size:13.5px;display:inline-flex;align-items:center;gap:6px;padding:4px 0}
.link:hover{color:var(--ink)}


.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:10px;box-shadow:var(--shadow)}
.toolbar .searchbox{box-shadow:none;border:1px solid var(--line);min-width:260px}
.toolbar .searchbox input{padding:11px 0;font-size:15px}
.sel{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:10px 12px;min-width:170px;outline:0}
.sel:focus{border-color:var(--gold)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-inline-start:auto}
.seg button{border:0;background:transparent;padding:9px 12px;color:var(--muted);display:grid;place-items:center}
.seg button svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7}
.seg button.on{background:#F3E8D0;color:#5E4719;box-shadow:inset 0 0 0 1px #E2CFA6}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 4px}
.chipf{line-height:1.25;border:1px solid var(--line);background:var(--paper);border-radius:24px;padding:6px 14px;font-size:13.5px;display:inline-flex;align-items:center;gap:7px;transition:.15s}
.chipf i{width:8px;height:8px;border-radius:50%}
.chipf:hover{border-color:var(--gold)}
.chipf.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.resultline{color:var(--muted);font-size:13.5px;margin:12px 2px}
.frow{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:14px 0 0;padding:2px 1px 4px;-webkit-overflow-scrolling:touch}
.frow::-webkit-scrollbar{display:none}
.fchip{flex:0 0 auto;display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--paper);color:var(--text);border-radius:999px;padding:0 15px;font-size:14.5px;line-height:1;white-space:nowrap;min-height:42px;transition:background-color .15s,border-color .15s,color .15s}
.fchip:hover{border-color:var(--gold)}
.fchip svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;flex:0 0 auto}
.fchip .cv{width:14px;height:14px;opacity:.5}
.fchip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.fchip .x{font-style:normal;font-size:11px;width:20px;height:20px;border-radius:50%;background:rgba(255,255,255,.18);display:grid;place-items:center}
.fclear{flex:0 0 auto;border:0;background:transparent;color:var(--gold);font-size:14px;padding:0 8px;min-height:42px}
.shback{position:fixed;inset:0;background:rgba(10,18,30,.45);opacity:0;pointer-events:none;transition:opacity .2s;z-index:60}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;background:var(--paper);border-radius:22px 22px 0 0;box-shadow:0 -12px 40px rgba(10,18,30,.2);transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);max-height:80vh;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom)}
body.sheet-on .shback{opacity:1;pointer-events:auto}
body.sheet-on .sheet{transform:none}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:#D9D2C3;margin:10px auto 0}
.shhead{display:flex;align-items:center;padding:12px 20px 12px;border-bottom:1px solid var(--line-2)}
.shhead h4{margin:0;font-family:var(--serif);font-size:20px;color:var(--ink)}
.shx{margin-inline-start:auto;border:0;background:#F2EDE3;width:34px;height:34px;border-radius:50%;color:var(--muted);font-size:14px}
.opts{overflow-y:auto;overscroll-behavior:contain;padding:8px 10px 16px}
body.sheet-on,body.dr-on{overflow:hidden}
.opt{width:100%;display:flex;align-items:center;gap:12px;border:0;background:transparent;text-align:start;padding:0 14px;border-radius:12px;font-size:16px;color:var(--text);min-height:52px}
.opt:hover{background:#F7F2E8}
.opt.sel{background:#F3ECDD;color:var(--ink);font-weight:600}
.opt em{margin-inline-start:auto;font-style:normal;font-size:13px;color:var(--muted);background:#F2EDE3;border-radius:999px;padding:3px 10px;font-weight:500}
.opt.sel em{background:#fff}
.opt .ck{color:var(--gold);font-size:17px;width:18px;text-align:center}
.opt:disabled{opacity:.38;cursor:default}
.opt .dot{width:10px;height:10px;border-radius:50%;flex:0 0 auto}
.shfoot{padding:10px 20px 16px;border-top:1px solid var(--line-2);display:flex}
.shfoot[hidden]{display:none}
.evgrp+.evgrp{margin-top:30px}
.evhead{display:flex;align-items:center;gap:12px;margin:4px 2px 14px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.evhead .dti{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;flex:0 0 auto;font-style:normal}
.evhead .dti svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7}
.evhead h3{margin:0;font-family:var(--serif);font-size:20px;line-height:1.3;color:var(--ink)}
.evhead small{display:block;margin-top:2px;font-size:13.5px;color:var(--muted)}
.sheet.drag{transition:none}

.opt.wi{min-height:58px;gap:14px;font-weight:500}
.opt .dti{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;flex:0 0 auto;font-style:normal}
.opt .dti svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7}
.opt .dti.all{background:#F2EDE3;color:var(--muted)}
.opt.wi+.opt.wi{border-top:1px solid var(--line-2);border-radius:0}
.opt.wi.sel,.opt.wi.sel+.opt.wi{border-top-color:transparent}
.opt.wi.sel{border-radius:12px}

@media(max-width:820px){.toolbar .seg{display:none}.frow{gap:6px;margin-top:12px}.fchip{padding:0 13px;font-size:14px;gap:6px}.fchip .cv{display:none}.fchip[data-f=sort]:not(.on){padding:0 12px}.fchip[data-f=sort]:not(.on) span{display:none}}
@media(min-width:821px){.sheet{left:50%;right:auto;bottom:auto;top:50%;width:440px;border-radius:20px;transform:translate(-50%,-46%);opacity:0;pointer-events:none;transition:transform .22s,opacity .22s}body.sheet-on .sheet{transform:translate(-50%,-50%);opacity:1;pointer-events:auto}.sheet .grab{display:none}}



.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;display:flex;flex-direction:column;box-shadow:var(--shadow);transition:transform .18s,box-shadow .18s,border-color .18s;position:relative;overflow:hidden}
.card::before{content:"";position:absolute;top:0;right:24px;left:24px;height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent);opacity:0;transition:.18s}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg);border-color:#DCCDAE}
.card:hover::before{opacity:1}
.cbody{padding:22px 22px 16px;display:flex;gap:16px}
.mono{width:58px;height:58px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;font-family:var(--serif);font-weight:700;font-size:21px;color:var(--ink);background:linear-gradient(160deg,#FBF6EC,#EFE4CC);box-shadow:inset 0 0 0 1px #E2D3B2,0 0 0 3px var(--paper),0 0 0 4px #E4D6B8;overflow:hidden}
.mono img{width:100%;height:100%;object-fit:cover}
.mono .ph{width:100%;height:100%;display:block;border-radius:50%;overflow:hidden}
.mono .ph svg{display:block;width:100%;height:100%;fill:none;stroke-width:1.35;stroke-linecap:round;stroke-linejoin:round}
.who{min-width:0}
.who h4{margin:2px 0 2px;font-family:var(--serif);font-size:21px;font-weight:700;color:var(--ink);line-height:1.25}
.who .role{color:var(--text);font-size:13.5px}
.who .org{color:var(--muted);font-size:13.5px;display:flex;align-items:center;gap:6px;margin-top:2px}
.who .org svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.7;flex:0 0 auto}
.tagrow{display:flex;flex-wrap:wrap;gap:6px;padding:0 22px}
.tag{display:inline-flex;align-items:center;gap:6px;border-radius:24px;padding:4px 11px;font-size:12px;font-weight:500;border:1px solid}
.tag i{width:6px;height:6px;border-radius:50%}
.topics{list-style:none;margin:14px 0 0;padding:0 22px;color:#4A5262;font-size:13.5px}
.topics li{position:relative;padding-right:14px;margin:4px 0}
.topics li::before{content:"";position:absolute;right:0;top:9px;width:5px;height:5px;transform:rotate(45deg);background:var(--gold);opacity:.8}
.card{cursor:pointer}.card .bar{position:absolute;top:0;right:0;left:0;height:3px}

body{font-size:15px}

    : fetch(API, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify({fn, args:a, v})})

}

function readDeck(file){
  const ext = (file.name.split('.').pop()||'').toLowerCase();
  const mime = {pdf:'application/pdf',ppt:'application/vnd.ms-powerpoint',pptx:'application/vnd.openxmlformats-officedocument.presentationml.presentation'}[ext];
  if (!mime) return Promise.reject(new Error('אפשר לצרף קובץ PDF או PowerPoint'));
  return new Promise((ok,no)=>{ const rd=new FileReader(); rd.onload=()=>ok({name:file.name, data:'data:'+mime+';base64,'+String(rd.result).split(',')[1]}); rd.onerror=()=>no(new Error('לא הצלחנו לקרוא את הקובץ')); rd.readAsDataURL(file); });
}
function shrink(file,mx,q){
  mx = mx||700; q = q||.84;
  return new Promise((ok,no)=>{ const rd=new FileReader(); rd.onload=()=>{ const im=new Image(); im.onload=()=>{ const s=Math.min(1,mx/Math.max(im.width,im.height)), c=document.createElement('canvas'); c.width=im.width*s; c.height=im.height*s; c.getContext('2d').drawImage(im,0,0,c.width,c.height); ok(c.toDataURL('image/jpeg',q)); }; im.onerror=no; im.src=rd.result; }; rd.readAsDataURL(file); });
}
async function saveForm(){
  const v = k => $('#f_'+k).value.trim();
  let bad = false;
  ['name','primaryCategoryId'].forEach(k=>{ if(!v(k)){ $('#w_'+k).classList.add('bad'); bad = true; } });
  if (bad) return;
  const p = {id: editing?editing.id:''};
  ['name','role','organization','orgType','meetType','primaryCategoryId','phone','email','linkedIn','telegram','connectionContext','additionalInterests','collaborationIdeas','professionalMaterials','notes','lastContactDate','meetingDate','deckUrl'].forEach(k=>p[k]=v(k));
  if (p.deckUrl && !/^https?:/i.test(p.deckUrl)) p.deckUrl = 'https:\/\/' + p.deckUrl;
  p.secondaryCategoryIds = selSecondary.filter(i=>i!==p.primaryCategoryId);
  p.assistanceTopics = $('#f_assistanceTopics').value.split(/\r?\n/).map(s=>s.trim()).filter(Boolean).map(s=>'• '+s.replace(/^[•\-\s]+/,''));
  const btn = $('#sv'), wasEdit = !!editing; btn.disabled = true; btn.textContent = 'שומר…';
  try{
    const r = await run('saveExpert', p, KEY); if (!editing) editing = {...p, id:r.id};
    if (newPhoto){ await run('uploadImage', r.id, newPhoto, newThumb, KEY); photos[r.id] = newPhoto; }
    if (newDeck){ btn.textContent = 'מעלה את המצגת…'; await run('uploadDeck', r.id, newDeck.data, newDeck.name, KEY); newDeck = null; }
    if (pendingSug){ await run('setSuggestionStatus', KEY, pendingSug, 'approved'); SUGS = SUGS.filter(z=>z.id!==pendingSug); pendingSug = null; }
    hide('modal'); await load(); toast(wasEdit?'הפרופיל עודכן':'המומחה נוסף למאגר');
  }catch(e){ toast(e.message); btn.disabled = false; btn.textContent = 'שמירה'; }
}
function askDelete(){
  if(!editing) return;
  $('#confirmText').innerHTML = `<p style="margin:0">למחוק את <b>${esc(editing.name)}</b> מהמאגר? הפעולה אינה הפיכה.</p>`;
  $('#confirmYes').onclick = async () => { try{ await run('deleteExpert', editing.id, KEY); hide('confirm'); hide('modal'); await load(); toast('המומחה נמחק'); }catch(e){ toast(e.message); } };
  show('confirm');
}
function addCategory(){
  $('#dialog').innerHTML = `<div class="hd"><h3>תחום ידע חדש</h3><button class="close" onclick="hide('modal')" aria-label="סגירה">${icon('x')}</button></div>
  <form class="bd" onsubmit="event.preventDefault();saveCat()"><div class="field" id="w_cat"><label>שם התחום <em>*</em></label><input id="f_cat" placeholder="למשל: תחבורה ציבורית"><div class="err">יש להזין שם</div></div></form>
  <div class="ft"><button class="btn dark" onclick="saveCat()">הוספה</button><button class="btn" onclick="hide('modal')">ביטול</button></div>`;
  show('modal'); setTimeout(()=>$('#f_cat').focus(),50);
}
async function saveCat(){
  const n = $('#f_cat').value.trim(); if(!n){ $('#w_cat').classList.add('bad'); return; }
  try{ await run('saveCategory',{name:n}, KEY); hide('modal'); await load(); toast('התחום נוסף'); }catch(e){ toast(e.message); }
}

function goBack(){ go(S.from && S.from!=='experts' ? S.from : 'experts', {q:'',cat:'',org:'',otype:'',mtype:'',fopen:false}); }

function renderSuggest(m){
  const fld = (k,l,o={}) => `<div class="field" id="w_s_${k}"><label>${l}${o.req?' <em>*</em>':''}</label><input id="s_${k}" ${o.type?`type="${o.type}"`:''} ${o.dir?`dir="${o.dir}"`:''} placeholder="${esc(o.ph||'')}">${o.req?'<div class="err">שדה חובה</div>':''}</div>`;
  const step = (n,t,sub,body) => `<section class="step"><div class="num">${n}</div><div><h4>${t}</h4><p class="sub">${sub}</p>${body}</div></section>`;
  m.innerHTML = `<div class="pagehead left"><div class="eyebrow">הרחבת המאגר</div><h1>הצעת מומחה למאגר</h1><p style="margin-top:6px">פגשתם מישהו ששווה להכיר? ספרו עליו בכמה שורות. ההצעה תעבור לאישור, ורק אחר כך תופיע במאגר.</p></div>
  <form class="sform" onsubmit="event.preventDefault();sendSuggestion()">
    ${step(1,'את מי פגשתם?','שם, תפקיד והארגון שבו הם עובדים', `<div class="sgrid">${fld('name','שם מלא',{req:1,ph:'שם פרטי ומשפחה'})}${fld('role','תפקיד',{ph:'למשל: מנהלת אגף תכנון'})}${fld('organization','ארגון / רשות',{ph:'למשל: עיריית שדרות'})}</div>`)}
    ${step(2,'מתי ואיפה נפגשתם?','תאריך המפגש ובאיזו מסגרת', `<div class="sgrid">${fld('meetingDate','תאריך המפגש',{type:'date'})}${fld('connectionContext','במסגרת',{ph:'למשל: יום עיון בנושא חברה וקהילה'})}</div>`)}
    ${step(3,'מה הערך המוסף?','במה הם יכולים לעזור לנו, ואיזה ידע או כלים אפשר לקבל מהם', `<div class="field"><textarea id="s_value" placeholder="שניים-שלושה משפטים"></textarea></div><div class="sgrid" style="margin-top:12px"><div class="field"><label>תחום ידע</label><select id="s_category"><option value="">לא בטוח/ה</option>${D.categories.map(c=>`<option>${esc(c.name)}</option>`).join('')}</select></div>${fld('deckUrl','קישור למצגת מהמפגש (אם יש)',{dir:'ltr',ph:'drive.google.com/...'})}</div>`)}
    ${step(4,'איך יוצרים קשר?','מה שיש בידיכם, גם פרט אחד עוזר', `<div class="sgrid">${fld('phone','טלפון',{type:'tel',dir:'ltr',ph:'050-0000000'})}${fld('email','דוא״ל',{type:'email',dir:'ltr',ph:'name@example.org.il'})}${fld('linkedIn','LinkedIn',{dir:'ltr',ph:'linkedin.com/in/...'})}</div>`)}
    ${step(5,'מי ממליץ?','כדי שנדע את מי לשאול על ההיכרות', `<div class="sgrid">${fld('submitter','השם שלך',{ph:'שם פרטי ומשפחה'})}</div>`)}
    <div class="sactions"><button class="btn-ink" id="sbtn" type="submit">שליחת ההצעה</button><span>שדות עם * הם חובה</span></div>
  </form>`;
  $('#s_name').addEventListener('input',()=>$('#w_s_name').classList.remove('bad'));
}
async function sendSuggestion(){
  const v = k => ($('#s_'+k)||{value:''}).value.trim();
  if (!v('name')){ $('#w_s_name').classList.add('bad'); $('#s_name').focus(); return; }
  const p = {}; ['name','role','organization','meetingDate','connectionContext','value','category','phone','email','linkedIn','submitter','deckUrl'].forEach(k=>p[k]=v(k));
  if (p.deckUrl && !/^https?:/i.test(p.deckUrl)) p.deckUrl = 'https:\/\/' + p.deckUrl;
  const b = $('#sbtn'); b.disabled = true; b.textContent = 'שולח…';
  try{
    await run('submitSuggestion', p);
    if (ADMIN) loadSuggestions();
    $('#main').innerHTML = `<div class="done"><div class="ok">${icon('check')}</div><h3>תודה, ההצעה התקבלה</h3><p>${esc(p.name)} ממתין/ה עכשיו לאישור, ואחרי האישור יופיע/תופיע במאגר.</p><button class="btn dark" onclick="go('suggest')">הצעת מומחה נוסף</button> <button class="btn" onclick="go('home')">חזרה לעמוד הבית</button></div>`;
  }catch(e){ toast(e.message); b.disabled = false; b.textContent = 'שליחת ההצעה'; }
}
async function loadSuggestions(){ try{ SUGS = (await run('listSuggestions', KEY)) || []; counts(); if (S.page==='inbox') render(); }catch(e){} }
function renderInbox(m){
  const row = (l,v) => v ? `<span>${l}</span><div>${esc(v)}</div>` : '';
  m.innerHTML = `<div class="pagehead left"><div class="eyebrow">ממתינות לאישורך</div><h1>הצעות ממתינות</h1></div>
  ${SUGS.length ? SUGS.map(x=>`<div class="sug"><h4>${esc(x.name)}</h4><div class="meta2">${esc([x.role,x.organization].filter(Boolean).join(' · '))}</div>
    <div class="kv2">${row('תאריך המפגש', x.meetingDate?dateHe(x.meetingDate):'')}${row('במסגרת', x.connectionContext)}${row('הערך המוסף', x.value)}${row('תחום מוצע', x.category)}${row('טלפון', x.phone)}${row('דוא״ל', x.email)}${row('LinkedIn', x.linkedIn)}${row('מצגת', x.deckUrl)}${row('הוצע על ידי', x.submitter)}</div>
    <div class="acts"><button class="btn dark" onclick="approveSug('${esc(x.id)}')">הוספה למאגר</button><button class="btn" onclick="rejectSug('${esc(x.id)}')">דחייה</button></div></div>`).join('') : `<div class="empty"><b>אין הצעות ממתינות</b>הצעות חדשות מחברי הקבוצה יופיעו כאן.</div>`}`;
}

const GF = [['meetingDate','תאריך מפגש',x=>!!parseDate(x.meetingDate)],['connectionContext','מסגרת המפגש',x=>!!x.connectionContext],['deckUrl','מצגת',x=>!!x.deckUrl],['about','פירוט יכולות',x=>!!(x.additionalInterests||(x.assistanceTopics||[]).length)],['phone','טלפון',x=>!!x.phone],['email','דוא״ל',x=>!!x.email],['linkedIn','לינקדאין',x=>!!x.linkedIn],['photo','תמונה',x=>!!(x.imageDriveFileId||x.thumb)],['orgType','סוג ארגון',x=>!!x.orgType],['meetType','איפה נפגשנו',x=>!!x.meetType]];
const gapsOf = x => GF.filter(f=>!f[2](x)).map(f=>f[1]);
let gapsAll = false;
function renderGaps(m){
  const rows = D.experts.map(x=>({x, miss:gapsOf(x)})).sort((a,b)=>b.miss.length-a.miss.length || String(a.x.name).localeCompare(String(b.x.name),'he'));
  const full = rows.filter(r=>!r.miss.length).length, shown = gapsAll ? rows : rows.filter(r=>r.miss.length);
  const per = GF.map(f=>D.experts.filter(x=>!f[2](x)).length);
  const top = GF.map((f,i)=>[f[1],per[i]]).filter(z=>z[1]).sort((a,b)=>b[1]-a[1])[0];
  const mark = ok => ok ? '<span class="gk" aria-label="קיים">✓</span>' : '<span class="gx" aria-label="חסר">✕</span>';
  m.innerHTML = `<div class="pagehead left"><div class="eyebrow">גלוי רק במצב עריכה</div><h1>מה חסר במאגר</h1><p style="margin-top:6px">✓ ירוק - קיים, ✕ אדום - חסר. לחיצה על שם פותחת את טופס העריכה.</p></div>
  <div class="gsum"><div><b>${D.experts.length - full}</b>פרופילים עם חוסרים</div><div><b>${full}</b>פרופילים מלאים</div>${top?`<div><b>${top[1]}</b>חסר הכי הרבה: ${esc(top[0])}</div>`:''}</div>
  <label class="gopt"><input type="checkbox" id="gall" ${gapsAll?'checked':''}> להציג גם פרופילים מלאים</label>
  ${shown.length ? `<div class="gwrap"><table class="gtab"><thead><tr><th class="nm">מומחה</th><th>הושלם</th>${GF.map(f=>`<th>${f[1]}</th>`).join('')}</tr></thead>
  <tbody>${shown.map(r=>`<tr><td class="nm"><button onclick="editExpert('${esc(r.x.id)}')">${esc(r.x.name)}</button><small>${esc(r.x.organization||'')}</small></td><td><span class="gpct">${GF.length-r.miss.length}/${GF.length}</span></td>${GF.map(f=>`<td>${mark(f[2](r.x))}</td>`).join('')}</tr>`).join('')}</tbody>
  <tfoot><tr><td class="nm">חסר אצל</td><td></td>${per.map(n=>`<td class="${n?'':'ok'}">${n||'✓'}</td>`).join('')}</tr></tfoot></table></div>
  <p class="gnote">בטלפון אפשר לגלול את הטבלה הצידה.</p>` : `<div class="empty"><b>כל הפרופילים מלאים</b>אין מה להשלים כרגע.</div>`}`;
  $('#gall').onchange = e => { gapsAll = e.target.checked; renderGaps(m); };
}
function approveSug(id){
  const x = SUGS.find(z=>z.id===id); if(!x) return;
  const c = D.categories.find(k=>k.name===x.category);
  const cc = String(x.connectionContext||''), og = String(x.organization||''); const meetType = /^הרצאה/.test(cc) ? 'הרצאה בקורס' : /יום עיון/.test(cc) ? 'יום עיון' : /סיור/.test(cc) ? 'סיור לימודי' : /התנסות/.test(cc) ? 'התנסות' : ''; const orgType = /^(עיריית|עירית|מועצה|מועצת)/.test(og) ? 'רשות מקומית' : /^משרד/.test(og) ? 'משרד ממשלתי' : ''; editExpert(null, {_sug:x.id, meetType, orgType, name:x.name, role:x.role, organization:x.organization, meetingDate:x.meetingDate, connectionContext:x.connectionContext, additionalInterests:x.value, phone:x.phone, email:x.email, linkedIn:x.linkedIn, deckUrl:x.deckUrl, primaryCategoryId:c?c.id:'', notes:x.submitter?'הוצע על ידי '+x.submitter:''});
}
async function rejectSug(id){ try{ await run('setSuggestionStatus', KEY, id, 'rejected'); SUGS = SUGS.filter(z=>z.id!==id); counts(); render(); toast('ההצעה נדחתה'); }catch(e){ toast(e.message); } }

document.addEventListener('keydown', e => {
  if (e.key==='Escape'){ if(document.body.classList.contains('sheet-on')) closeSheet(); else if($('#confirm').classList.contains('on')) hide('confirm'); else if($('#modal').classList.contains('on')) hide('modal'); else closeDrawer(); }
  if (e.key==='/' && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){ e.preventDefault(); if(S.page!=='home'&&S.page!=='experts') go('experts'); setTimeout(()=>{ const q=$('#q')||$('#hq'); q&&q.focus(); },30); }
});

if (!LIVE) document.body.insertAdjacentHTML('beforeend','<div class="preview">תצוגה מקדימה: שינויים כאן לא נשמרים</div>');
const h = (location.hash||'').slice(1); if (['experts','suggest'].includes(h)) S.page = h;
if (ADMIN) document.body.classList.add('admin');
(k => { if (!k) return; KEY = k; run('checkKey', k).then(ok => { ADMIN = !!ok; if (ADMIN){ document.body.classList.add('admin'); loadSuggestions(); if (['inbox','gaps'].includes(h)) go(h); else if (loaded) counts(); } }).catch(()=>{}); })(K0);
if (!LIVE) setTimeout(loadSuggestions, 300);
document.querySelectorAll('#nav button,#tabs button').forEach(b=>b.classList.toggle('on', b.dataset.p===S.page));
Object.assign(window,{reloadData:()=>{ loaded=false; render(); load(); },openSheet,closeSheet,goBack,editExpert,go,profile,closeDrawer,hide,copy,askDelete,addCategory,saveCat,saveForm,sendSuggestion,approveSug,rejectSug});
render(); load();
})();
</script>
